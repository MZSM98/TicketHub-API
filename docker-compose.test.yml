services:
  mysql:
    ports: !reset []

  minio:
    ports: !reset []

  mailpit:
    ports: !reset []

  gateway:
    ports: !reset []

  catalog-service:
    environment:
      INVENTORY_SERVICE_URL: http://tests:4100
      PURCHASE_SERVICE_URL: http://tests:4100

  gateway-slow:
    extends: { file: docker-compose.yml, service: gateway }
    ports: !reset []
    environment:
      GATEWAY_REQUEST_TIMEOUT_SECONDS: '3'
      GATEWAY_HEADERS_TIMEOUT_SECONDS: '2'

  purchase-service:
    environment:
      STRIPE_API_BASE: http://tests:4100
      STRIPE_SECRET_KEY: sk_test_fake_tickethub
      PAYMENT_NAMESPACE: tickethub-pruebas
      STRIPE_TIMEOUT_MS: '1500'
      TICKET_SERVICE_URL: http://tests:4100
      TICKET_RETRY_SECONDS: '0'
      PAYMENT_SWEEP_SECONDS: '1'
      PAYMENT_RECONCILE_AFTER_SECONDS: '4'
      PAYMENT_RECOVERY_MAX_ATTEMPTS: '3'
      TICKET_RETRY_BACKOFF_SECONDS: '1'

  purchase-isolated:
    extends: { file: docker-compose.yml, service: purchase-service }
    environment:
      STRIPE_API_BASE: http://tests:4100
      STRIPE_SECRET_KEY: sk_test_fake_tickethub
      PAYMENT_NAMESPACE: tickethub-pruebas
      INVENTORY_SERVICE_URL: http://inventory-down.invalid:3003
      CATALOG_SERVICE_URL: http://catalog-down.invalid:3002
      TICKET_SERVICE_URL: http://tests:4100
      TICKET_RETRY_SECONDS: '1'
      TICKET_RETRY_BACKOFF_SECONDS: '1'
      TICKET_RETRY_MAX_SECONDS: '8'
      TICKET_RETRY_BATCH: '2'
      TICKET_RETRY_MAX_ATTEMPTS: '5'
      PAYMENT_SWEEP_SECONDS: '0'

  purchase-shortclaim:
    extends: { file: docker-compose.yml, service: purchase-service }
    environment:
      STRIPE_API_BASE: http://tests:4100
      STRIPE_SECRET_KEY: sk_test_fake_tickethub
      PAYMENT_NAMESPACE: tickethub-pruebas
      STRIPE_TIMEOUT_MS: '1500'
      INTERNAL_TIMEOUT_MS: '1500'
      TICKET_SERVICE_URL: http://tests:4100
      TICKET_RETRY_SECONDS: '0'
      PAYMENT_SWEEP_SECONDS: '0'
      PAYMENT_CLAIM_SECONDS: '2'

  inventory-sweep:
    extends: { file: docker-compose.yml, service: inventory-service }
    environment:
      RESERVATION_TTL_MINUTES: '0.05'
      RESERVATION_SWEEP_SECONDS: '1'

  inventory-lazy:
    extends: { file: docker-compose.yml, service: inventory-service }
    environment:
      RESERVATION_TTL_MINUTES: '0.05'
      RESERVATION_SWEEP_SECONDS: '0'

  inventory-nocatalog:
    extends: { file: docker-compose.yml, service: inventory-service }
    environment:
      CATALOG_SERVICE_URL: http://catalog-down.invalid:3002

  gateway-trusted:
    extends: { file: docker-compose.yml, service: gateway }
    ports: !reset []
    environment:
      TRUST_PROXY: 0.0.0.0/0

  gateway-degraded:
    extends: { file: docker-compose.yml, service: gateway }
    ports: !reset []
    environment:
      TICKET_SERVICE_URL: http://ticket-down.invalid:3005

  tests:
    environment:
      GATEWAY_DEGRADED_URL: http://gateway-degraded:8080/api/v1
      GATEWAY_TRUSTED_URL: http://gateway-trusted:8080/api/v1
      PAYMENT_NAMESPACE: tickethub-pruebas
      INVENTORY_URL: http://inventory-service:3003/api/v1
      INVENTORY_SWEEP_URL: http://inventory-sweep:3003/api/v1
      INVENTORY_LAZY_URL: http://inventory-lazy:3003/api/v1
      INVENTORY_NOCATALOG_URL: http://inventory-nocatalog:3003/api/v1
      PURCHASE_URL: http://purchase-service:3004/api/v1
      PURCHASE_ISOLATED_URL: http://purchase-isolated:3004/api/v1
      PURCHASE_SHORTCLAIM_URL: http://purchase-shortclaim:3004/api/v1
      GATEWAY_SLOW_URL: http://gateway-slow:8080/api/v1
    depends_on:
      inventory-service: { condition: service_healthy }
      inventory-sweep: { condition: service_healthy }
      inventory-lazy: { condition: service_healthy }
      inventory-nocatalog: { condition: service_healthy }
      purchase-service: { condition: service_healthy }
      purchase-isolated: { condition: service_healthy }
      purchase-shortclaim: { condition: service_healthy }
      gateway-slow: { condition: service_started }
      gateway-trusted: { condition: service_healthy }
      gateway-degraded: { condition: service_healthy }
