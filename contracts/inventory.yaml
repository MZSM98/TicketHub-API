openapi: 3.0.3
info:
  title: TicketHub InventoryService
  version: 1.0.0
  description: |
    Zones, seats, availability and temporary reservations.

    Use cases: CU-05, CU-06, CU-07, and the zone setup part of CU-12. Internal endpoints serve CU-08.

    **Concurrency (RF-03, RNF-02).** NUMBERED zones: the seats are locked with
    `SELECT ... FOR UPDATE` inside one transaction. GENERAL zones: one atomic
    `UPDATE zones SET reserved_count = reserved_count + n WHERE capacity - reserved_count - sold_count >= n`.
    The request is all-or-nothing: if one seat is lost, nothing is reserved and the API answers
    409 `SEAT_UNAVAILABLE`.

    **Expiration.** A reservation lasts `RESERVATION_TTL_MINUTES` (default 10). A job releases
    expired reservations every minute, and every read or write of a reservation also checks `expiresAt`.

    **Event ownership.** Zone and seat management ("ORGANIZER (owner)") reads the event's
    `organizerId` from CatalogService `GET /internal/events/{eventId}` and answers 403
    `NOT_EVENT_OWNER` when it is not the caller. For `/zones/{zoneId}/**` the event is the zone's `eventId`.

    Roles per endpoint are listed in each operation as **Role:**. Public endpoints have `security: []`.
    Endpoints under `/internal/**` are service-to-service only; the API Gateway does not route them.
servers:
  - url: http://localhost:8080/api/v1
    description: API Gateway (clients)
  - url: http://inventory-service:3003/api/v1
    description: Direct service URL inside the Docker network (internal calls)
security:
  - bearerAuth: []
tags:
  - name: Availability
    description: Public availability and seat map (CU-05).
  - name: Zones
    description: Zone and seat setup by the event owner (CU-12).
  - name: Reservations
    description: Temporary reservations (CU-06, CU-07).
  - name: Internal
    description: Service-to-service endpoints. Not routed by the API Gateway.
paths:
  /events/{eventId}/availability:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Availability]
      operationId: getEventAvailability
      summary: Availability per zone (CU-05)
      description: |
        **Role:** public. `soldOut=true` at event level means "Boletos agotados". Expired
        reservations are not counted as reserved.
      security: []
      responses:
        '200':
          description: Availability summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAvailability'
              example:
                eventId: 12
                soldOut: false
                zones:
                  - id: 31
                    name: VIP
                    type: NUMBERED
                    price: '2500.00'
                    currency: MXN
                    capacity: 100
                    available: 12
                    soldOut: false
                  - id: 32
                    name: General
                    type: GENERAL
                    price: '900.00'
                    currency: MXN
                    capacity: 2000
                    available: 0
                    soldOut: true
        '404':
          $ref: '#/components/responses/EventNotFound'
        '410':
          $ref: '#/components/responses/EventNotAvailable'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

  /zones/{zoneId}/seats:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    get:
      tags: [Availability]
      operationId: getZoneSeatMap
      summary: Seat map of a NUMBERED zone (CU-05)
      description: |
        **Role:** public. Clients draw RESERVED and SOLD seats as not selectable. For a GENERAL zone
        the API returns 409 `ZONE_NOT_NUMBERED`. Same visibility as the event availability (checked
        with CatalogService): a zone of a DRAFT event answers 404 `ZONE_NOT_FOUND`, a zone of a
        CANCELLED or already started event answers 410 `EVENT_NOT_AVAILABLE`, and 503 when
        CatalogService is not reachable.
      security: []
      responses:
        '200':
          description: Seats grouped by row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
              example:
                zoneId: 31
                eventId: 12
                name: VIP
                price: '2500.00'
                currency: MXN
                rows:
                  - rowLabel: A
                    seats:
                      - id: 9001
                        seatNumber: 1
                        status: SOLD
                      - id: 9002
                        seatNumber: 2
                        status: AVAILABLE
                      - id: 9003
                        seatNumber: 3
                        status: RESERVED
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '409':
          $ref: '#/components/responses/ZoneNotNumbered'
        '410':
          $ref: '#/components/responses/EventNotAvailable'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'
    post:
      tags: [Zones]
      operationId: generateZoneSeats
      summary: Generate the seats of a NUMBERED zone (CU-12)
      description: |
        **Role:** ORGANIZER (owner of the event). Replaces the seat layout. Allowed only while no seat
        of the zone is RESERVED or SOLD. The total number of seats must equal the zone `capacity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatLayoutInput'
            example:
              rows:
                - rowLabel: A
                  seatCount: 50
                - rowLabel: B
                  seatCount: 50
      responses:
        '201':
          description: Seats created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '400':
          description: Invalid layout (for example, seat total does not match capacity).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: SEAT_COUNT_MISMATCH
                message: El total de asientos debe ser igual a la capacidad de la zona
                details:
                  capacity: 100
                  seats: 90
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '409':
          description: The zone is GENERAL, or it already has reserved or sold seats.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                general:
                  value:
                    code: ZONE_NOT_NUMBERED
                    message: La zona es general y no tiene asientos numerados
                inUse:
                  value:
                    code: ZONE_HAS_SALES
                    message: La zona ya tiene asientos reservados o vendidos
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

  /events/{eventId}/zones:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Zones]
      operationId: listEventZones
      summary: List zones of my event with counters (CU-12)
      description: '**Role:** ORGANIZER (owner), ADMIN. Includes raw `reservedCount` and `soldCount`. Ownership is checked with CatalogService; 503 when it is not reachable.'
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'
    post:
      tags: [Zones]
      operationId: createZone
      summary: Add a zone to my event (CU-12)
      description: |
        **Role:** ORGANIZER (owner, checked with CatalogService `GET /internal/events/{eventId}`).
        The event must not be CANCELLED. For NUMBERED zones, create the seats next with
        `POST /zones/{zoneId}/seats`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
            example:
              name: VIP
              type: NUMBERED
              price: '2500.00'
              capacity: 100
      responses:
        '201':
          description: Zone created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/EventNotEditable'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

  /zones/{zoneId}:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    put:
      tags: [Zones]
      operationId: updateZone
      summary: Edit a zone of my event (CU-12)
      description: |
        **Role:** ORGANIZER (owner). `type` cannot change once the zone exists. `capacity` cannot go
        below `reservedCount + soldCount`. Price changes do not affect existing reservations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '200':
          description: Zone updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '409':
          description: |
            `ZONE_TYPE_CHANGE` when `type` differs from the current one (details carry the current
            type), `CAPACITY_BELOW_COMMITTED` when `capacity` is below what is already reserved or
            sold, or `ZONE_HAS_SALES` when the capacity of a NUMBERED zone changes while it has
            reservations or sales (without them the seat layout is deleted and must be generated again).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                typeChange:
                  summary: The zone type cannot change
                  value:
                    code: ZONE_TYPE_CHANGE
                    message: El tipo de la zona no se puede cambiar
                    details:
                      type: NUMBERED
                capacityBelowCommitted:
                  summary: Capacity below reserved plus sold
                  value:
                    code: CAPACITY_BELOW_COMMITTED
                    message: La capacidad no puede ser menor a los boletos reservados o vendidos
                    details:
                      committed: 140
                hasSales:
                  summary: NUMBERED zone resized while it has reservations or sales
                  value:
                    code: ZONE_HAS_SALES
                    message: La zona ya tiene asientos reservados o vendidos
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'
    delete:
      tags: [Zones]
      operationId: deleteZone
      summary: Delete a zone of my event (CU-12)
      description: '**Role:** ORGANIZER (owner). Only if nothing in the zone is reserved or sold.'
      responses:
        '204':
          description: Zone and its seats deleted.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '409':
          description: The zone has reservations or sales.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: ZONE_HAS_SALES
                message: La zona ya tiene asientos reservados o vendidos
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

  /reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Reserve seats or general tickets (CU-06)
      description: |
        **Role:** BUYER. All items must belong to `eventId`, which must be PUBLISHED and in the future.
        A buyer can have only one ACTIVE reservation at a time. Max `MAX_TICKETS_PER_RESERVATION`
        tickets (default 10). The hard limit is 10: InventoryService refuses to start when
        `MAX_TICKETS_PER_RESERVATION` is not an integer between 1 and 10. Each item is either `{ seatId }` (NUMBERED zone) or
        `{ zoneId, quantity }` (GENERAL zone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
            examples:
              numbered:
                summary: Two numbered seats
                value:
                  eventId: 12
                  items:
                    - seatId: 9002
                    - seatId: 9004
              general:
                summary: Three general tickets
                value:
                  eventId: 12
                  items:
                    - zoneId: 32
                      quantity: 3
      responses:
        '201':
          description: Seats locked; the client goes to Checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                id: 5001
                userId: 101
                eventId: 12
                status: ACTIVE
                createdAt: '2026-10-26T15:40:00Z'
                expiresAt: '2026-10-26T15:50:00Z'
                secondsRemaining: 600
                total: '5000.00'
                currency: MXN
                items:
                  - zoneId: 31
                    zoneName: VIP
                    seatId: 9002
                    rowLabel: A
                    seatNumber: 2
                    quantity: 1
                    unitPrice: '2500.00'
                  - zoneId: 31
                    zoneName: VIP
                    seatId: 9004
                    rowLabel: A
                    seatNumber: 4
                    quantity: 1
                    unitPrice: '2500.00'
        '400':
          description: Invalid body (empty items, too many tickets, seat and zone mixed in one item, item from another event).
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: TOO_MANY_TICKETS
                message: Solo puede reservar hasta 10 boletos
                details:
                  max: 10
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          description: Lost the race for a seat, not enough capacity, or the buyer already has an active reservation.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              examples:
                seatUnavailable:
                  summary: Another buyer locked the seat first (CU-06 FA1)
                  value:
                    code: SEAT_UNAVAILABLE
                    message: Asiento ya no disponible
                    details:
                      unavailableSeatIds: [9004]
                zoneCapacity:
                  summary: Not enough places left in a GENERAL zone
                  value:
                    code: ZONE_CAPACITY_EXCEEDED
                    message: No hay suficientes lugares disponibles en la zona
                    details:
                      zoneId: 32
                      available: 1
                activeReservation:
                  summary: The buyer already has an ACTIVE reservation
                  value:
                    code: ACTIVE_RESERVATION_EXISTS
                    message: Ya tiene una reserva activa, termínela o cancélela primero
                    details:
                      reservationId: 4990
        '410':
          $ref: '#/components/responses/EventNotAvailable'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'
        '500':
          description: Unexpected concurrency failure (CU-06 EX1), for example a deadlock after retries.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: RESERVATION_FAILED
                message: Error al procesar reserva
        '503':
          $ref: './common.yaml#/components/responses/ServiceUnavailable'

  /reservations/active:
    get:
      tags: [Reservations]
      operationId: getMyActiveReservation
      summary: Get my active reservation
      description: |
        **Role:** BUYER. Used by Checkout to show the countdown. Returns 404 when there is none
        (or it has just expired).
      responses:
        '200':
          description: The caller's ACTIVE reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          description: No active reservation.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: NO_ACTIVE_RESERVATION
                message: No tiene una reserva activa

  /reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Reservations]
      operationId: getMyReservation
      summary: Get one of my reservations
      description: '**Role:** BUYER (owner). An expired reservation comes back with status EXPIRED.'
      responses:
        '200':
          description: Reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'

  /reservations/{reservationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [Reservations]
      operationId: cancelMyReservation
      summary: Cancel my reservation and release the seats (CU-07)
      description: '**Role:** BUYER (owner). Idempotent: cancelling a CANCELLED reservation returns 200.'
      responses:
        '200':
          description: Reservation cancelled; seats are AVAILABLE again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: The reservation was already paid.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: RESERVATION_ALREADY_CONFIRMED
                message: La reserva ya fue pagada y no se puede cancelar
        '410':
          $ref: '#/components/responses/ReservationExpired'

  /internal/reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Internal]
      operationId: internalGetReservation
      summary: Check a reservation before charging (internal, CU-08 verificarVigenciaReserva)
      description: |
        **Internal** (service-to-service). PurchaseService reads status, owner, items, `total` and
        `purchaseId`. It must reject the payment unless `status=ACTIVE` and `expiresAt` is in the
        future. `purchaseId` lets PurchaseService recognize a reservation CONFIRMED by its own
        purchase (for example after a failed capture) and finish that purchase instead of undoing it.
      security:
        - internalAuth: []
      responses:
        '200':
          description: Reservation (status already reflects expiration) plus `purchaseId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalReservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReservationNotFound'

  /internal/reservations/{reservationId}/confirm-sale:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [Internal]
      operationId: internalConfirmSale
      summary: Mark reserved seats as SOLD (internal, CU-08 confirmarVentaAsientos)
      description: |
        **Internal** (service-to-service). Called by PurchaseService after a successful charge.
        In one transaction: reservation -> CONFIRMED, seats RESERVED -> SOLD, zone counters move from
        `reservedCount` to `soldCount`. Idempotent: confirming a CONFIRMED reservation with the same
        `purchaseId` returns 200 with the same body.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseId]
              properties:
                purchaseId:
                  $ref: './common.yaml#/components/schemas/Id'
            example:
              purchaseId: 8001
      responses:
        '200':
          description: Sale confirmed. The items are what TicketService needs to issue one ticket per place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: Reservation is CANCELLED, or CONFIRMED by a different purchase.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: INVALID_RESERVATION_STATE
                message: La reserva no se puede confirmar
                details:
                  status: CANCELLED
        '410':
          $ref: '#/components/responses/ReservationExpired'
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'

  /internal/reservations/{reservationId}/release:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [Internal]
      operationId: internalReleaseReservation
      summary: Cancel a reservation and free its seats (internal, CU-08 "Límite de intentos agotado")
      description: |
        **Internal** (service-to-service). Called by PurchaseService when the buyer runs out of
        payment attempts. Same effect as CU-07 without the owner check. Idempotent.
      security:
        - internalAuth: []
      responses:
        '200':
          description: Reservation CANCELLED (or already CANCELLED/EXPIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: The reservation is CONFIRMED and cannot be released.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: RESERVATION_ALREADY_CONFIRMED
                message: La reserva ya fue pagada y no se puede cancelar

  /internal/reservations/{reservationId}/revoke-sale:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [Internal]
      operationId: internalRevokeSale
      summary: Undo a confirmed sale whose capture was definitively declined (internal, CU-08)
      description: |
        **Internal** (service-to-service). Called by PurchaseService when the provider definitively
        rejects the capture after `confirm-sale`. In one transaction: seats SOLD -> AVAILABLE,
        `soldCount` goes down, reservation CONFIRMED -> CANCELLED and `purchaseId` is cleared.
        Idempotent: a CANCELLED or EXPIRED reservation returns 200 without changes.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseId]
              properties:
                purchaseId:
                  $ref: './common.yaml#/components/schemas/Id'
            example:
              purchaseId: 8001
      responses:
        '200':
          description: Sale revoked (or the reservation was already CANCELLED/EXPIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: The reservation is ACTIVE, or CONFIRMED by a different purchase.
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/Error'
              example:
                code: INVALID_RESERVATION_STATE
                message: La venta de la reserva no se puede revocar
                details:
                  status: CONFIRMED
        '413':
          $ref: './common.yaml#/components/responses/PayloadTooLarge'

  /internal/zones:
    get:
      tags: [Internal]
      operationId: internalGetZonesByIds
      summary: Get zones by id (internal)
      description: |
        **Internal** (service-to-service). Batch lookup used by TicketService (zone names for
        `GET /tickets/me`) and PurchaseService (per-zone sales for CU-13, with `eventId`).
        Send exactly one of `ids` or `eventId`.
      security:
        - internalAuth: []
      parameters:
        - name: ids
          in: query
          style: form
          explode: false
          description: Comma-separated zone ids (max 100).
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              format: int64
        - name: eventId
          in: query
          description: All zones of this event.
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: Zones with counters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        '400':
          $ref: './common.yaml#/components/responses/ValidationError'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /internal/events/{eventId}/zones:
    parameters:
      - $ref: '#/components/parameters/EventId'
    delete:
      tags: [Internal]
      operationId: internalDeleteEventZones
      summary: Delete all zones of an event (internal, CU-12)
      description: |
        **Internal** (service-to-service). Called by CatalogService before it deletes a DRAFT
        event, so no zones are left without an event. Seats are deleted with their zones. A DRAFT
        event never had reservations or sales, because it cannot go back to DRAFT once published.
        Idempotent: an event without zones, or one that does not exist, also answers 204.
      security:
        - internalAuth: []
      responses:
        '204':
          description: The event has no zones anymore.
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
    internalAuth:
      $ref: './common.yaml#/components/securitySchemes/internalAuth'
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Id'
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Id'
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/Id'
  responses:
    EventNotFound:
      description: Event not found, or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: EVENT_NOT_FOUND
            message: El evento no existe
    EventNotAvailable:
      description: The event is CANCELLED or already started.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: EVENT_NOT_AVAILABLE
            message: El evento ya no está disponible
    EventNotEditable:
      description: The event is CANCELLED.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: INVALID_EVENT_STATE
            message: El evento no se puede modificar en su estado actual
    ZoneNotFound:
      description: Zone not found.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: ZONE_NOT_FOUND
            message: La zona no existe
    ZoneNotNumbered:
      description: The zone is GENERAL and has no seats.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: ZONE_NOT_NUMBERED
            message: La zona es general y no tiene asientos numerados
    ReservationNotFound:
      description: Reservation not found.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: RESERVATION_NOT_FOUND
            message: La reserva no existe
    ReservationExpired:
      description: The reservation timer reached zero; the seats were released (CU-07 FA1).
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/Error'
          example:
            code: RESERVATION_EXPIRED
            message: Tiempo agotado
  schemas:
    ZoneType:
      type: string
      enum: [NUMBERED, GENERAL]
    SeatStatus:
      type: string
      enum: [AVAILABLE, RESERVED, SOLD]
    ReservationStatus:
      type: string
      enum: [ACTIVE, CONFIRMED, CANCELLED, EXPIRED]
    ZoneInput:
      type: object
      required: [name, type, price, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: VIP
        type:
          $ref: '#/components/schemas/ZoneType'
        price:
          $ref: './common.yaml#/components/schemas/Money'
        capacity:
          type: integer
          minimum: 1
          maximum: 100000
    Zone:
      type: object
      required: [id, eventId, name, type, price, currency, capacity, reservedCount, soldCount]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        eventId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
        type:
          $ref: '#/components/schemas/ZoneType'
        price:
          $ref: './common.yaml#/components/schemas/Money'
        currency:
          $ref: './common.yaml#/components/schemas/Currency'
        capacity:
          type: integer
        reservedCount:
          type: integer
        soldCount:
          type: integer
    ZoneAvailability:
      type: object
      required: [id, name, type, price, currency, capacity, available, soldOut]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
        type:
          $ref: '#/components/schemas/ZoneType'
        price:
          $ref: './common.yaml#/components/schemas/Money'
        currency:
          $ref: './common.yaml#/components/schemas/Currency'
        capacity:
          type: integer
        available:
          type: integer
          description: capacity - reservedCount - soldCount.
        soldOut:
          type: boolean
          description: True when `available` is 0.
    EventAvailability:
      type: object
      required: [eventId, soldOut, zones]
      properties:
        eventId:
          $ref: './common.yaml#/components/schemas/Id'
        soldOut:
          type: boolean
          description: True when every zone is sold out ("Boletos agotados").
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneAvailability'
    Seat:
      type: object
      required: [id, seatNumber, status]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        seatNumber:
          type: integer
          minimum: 1
          description: |
            Position in the row: consecutive from 1 to the row's `seatCount`, with no gaps. Aisles are
            not modelled, so consecutive numbers in the same row are adjacent seats.
        status:
          $ref: '#/components/schemas/SeatStatus'
    SeatMap:
      type: object
      description: |
        Rows come in the order the organizer sent them when the seats were generated (not sorted by
        `rowLabel`). Within a row, seats are sorted by `seatNumber` ascending.
      required: [zoneId, eventId, name, price, currency, rows]
      properties:
        zoneId:
          $ref: './common.yaml#/components/schemas/Id'
        eventId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
        price:
          $ref: './common.yaml#/components/schemas/Money'
        currency:
          $ref: './common.yaml#/components/schemas/Currency'
        rows:
          type: array
          description: In the order the organizer defined them, not sorted by `rowLabel`.
          items:
            type: object
            required: [rowLabel, seats]
            properties:
              rowLabel:
                type: string
              seats:
                type: array
                description: Sorted by `seatNumber` ascending (1..seatCount).
                items:
                  $ref: '#/components/schemas/Seat'
    SeatLayoutInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [rowLabel, seatCount]
            properties:
              rowLabel:
                type: string
                minLength: 1
                maxLength: 10
              seatCount:
                type: integer
                minimum: 1
                maximum: 500
                description: Seats are numbered 1..seatCount.
    SeatItemInput:
      type: object
      required: [seatId]
      additionalProperties: false
      properties:
        seatId:
          $ref: './common.yaml#/components/schemas/Id'
    GeneralItemInput:
      type: object
      required: [zoneId, quantity]
      additionalProperties: false
      properties:
        zoneId:
          $ref: './common.yaml#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
    CreateReservationRequest:
      type: object
      required: [eventId, items]
      properties:
        eventId:
          $ref: './common.yaml#/components/schemas/Id'
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: At most `MAX_TICKETS_PER_RESERVATION` (integer 1-10, default 10) items; never more than 10.
          items:
            oneOf:
              - $ref: '#/components/schemas/SeatItemInput'
              - $ref: '#/components/schemas/GeneralItemInput'
    ReservationItem:
      type: object
      required: [zoneId, zoneName, quantity, unitPrice]
      properties:
        zoneId:
          $ref: './common.yaml#/components/schemas/Id'
        zoneName:
          type: string
        seatId:
          type: integer
          format: int64
          nullable: true
          description: Set for NUMBERED zones (then quantity is 1); null for GENERAL zones.
        rowLabel:
          type: string
          nullable: true
        seatNumber:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: './common.yaml#/components/schemas/Money'
    InternalReservation:
      description: Reservation as seen by PurchaseService. Same shape as `Reservation`.
      allOf:
        - $ref: '#/components/schemas/Reservation'
    Reservation:
      type: object
      required: [id, userId, eventId, status, purchaseId, createdAt, expiresAt, secondsRemaining, total, currency, items]
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        userId:
          $ref: './common.yaml#/components/schemas/Id'
        eventId:
          $ref: './common.yaml#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        purchaseId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Purchase that paid the reservation. Set while `status=CONFIRMED`; null for ACTIVE,
            EXPIRED and CANCELLED (including a sale undone after a rejected capture).
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: createdAt + RESERVATION_TTL_MINUTES (default 10).
        secondsRemaining:
          type: integer
          minimum: 0
          description: Server-computed, so the client countdown does not depend on the device clock. 0 unless ACTIVE.
        total:
          $ref: './common.yaml#/components/schemas/Money'
        currency:
          $ref: './common.yaml#/components/schemas/Currency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItem'
