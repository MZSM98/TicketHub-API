name: tickethub

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [tickethub]

x-db-env: &db-env
  NODE_ENV: ${NODE_ENV}
  MYSQL_HOST: ${MYSQL_HOST}
  MYSQL_PORT: ${MYSQL_PORT}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  JWT_SECRET: ${JWT_SECRET}

x-service-urls: &service-urls
  IDENTITY_SERVICE_URL: http://identity-service:3001
  CATALOG_SERVICE_URL: http://catalog-service:3002
  INVENTORY_SERVICE_URL: http://inventory-service:3003
  PURCHASE_SERVICE_URL: http://purchase-service:3004
  TICKET_SERVICE_URL: http://ticket-service:3005

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ['--default-time-zone=+00:00']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Los usa db/init/99-service-users.sh para crear un usuario por servicio.
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      PURCHASE_DB_USER: ${PURCHASE_DB_USER}
      PURCHASE_DB_PASSWORD: ${PURCHASE_DB_PASSWORD}
      TICKET_DB_USER: ${TICKET_DB_USER}
      TICKET_DB_PASSWORD: ${TICKET_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT}:3306'
    healthcheck:
      # Durante la inicialización MySQL no escucha por TCP, así que esto falla hasta que termina.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tickethub]

  minio:
    # Las imágenes oficiales minio/minio ya no están en Docker Hub; esta la recompila Chainguard.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tickethub]

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    restart: 'no'
    entrypoint: ['sh', '/init/init.sh']
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_POSTERS: ${MINIO_BUCKET_POSTERS}
      MINIO_BUCKET_QR: ${MINIO_BUCKET_QR}
      CATALOG_MINIO_ACCESS_KEY: ${CATALOG_MINIO_ACCESS_KEY}
      CATALOG_MINIO_SECRET_KEY: ${CATALOG_MINIO_SECRET_KEY}
      TICKET_MINIO_ACCESS_KEY: ${TICKET_MINIO_ACCESS_KEY}
      TICKET_MINIO_SECRET_KEY: ${TICKET_MINIO_SECRET_KEY}
    volumes:
      - ./minio/init.sh:/init/init.sh:ro
    depends_on:
      minio: { condition: service_healthy }
    networks: [tickethub]

  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_HOST_PORT}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tickethub]

  identity-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/identity/Dockerfile }
    environment:
      <<: *db-env
      PORT: 3001
      DB_NAME: ${IDENTITY_DB_NAME}
      DB_USER: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      # Solo para el script create-admin.
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      mysql: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  catalog-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      <<: [*db-env, *service-urls]
      PORT: 3002
      DB_NAME: ${CATALOG_DB_NAME}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GATEWAY_FORWARD_SECRET: ${GATEWAY_FORWARD_SECRET}
      PUBLIC_HOSTS_ALLOWED: ${PUBLIC_HOSTS_ALLOWED:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${CATALOG_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${CATALOG_MINIO_SECRET_KEY}
      MINIO_BUCKET_POSTERS: ${MINIO_BUCKET_POSTERS}
    depends_on:
      mysql: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  inventory-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/inventory/Dockerfile }
    environment:
      <<: [*db-env, *service-urls]
      PORT: 3003
      DB_NAME: ${INVENTORY_DB_NAME}
      DB_USER: ${INVENTORY_DB_USER}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES}
      MAX_TICKETS_PER_RESERVATION: ${MAX_TICKETS_PER_RESERVATION}
      RESERVATION_SWEEP_SECONDS: ${RESERVATION_SWEEP_SECONDS:-60}
    depends_on:
      mysql: { condition: service_healthy }

  purchase-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/purchase/Dockerfile }
    environment:
      <<: [*db-env, *service-urls]
      PORT: 3004
      DB_NAME: ${PURCHASE_DB_NAME}
      DB_USER: ${PURCHASE_DB_USER}
      DB_PASSWORD: ${PURCHASE_DB_PASSWORD}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_NAMESPACE: ${PAYMENT_NAMESPACE}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
      STRIPE_TIMEOUT_MS: ${STRIPE_TIMEOUT_MS:-10000}
      TICKET_RETRY_SECONDS: ${TICKET_RETRY_SECONDS:-30}
      PAYMENT_SWEEP_SECONDS: ${PAYMENT_SWEEP_SECONDS:-60}
      PAYMENT_RECONCILE_AFTER_SECONDS: ${PAYMENT_RECONCILE_AFTER_SECONDS:-60}
      PAYMENT_RECOVERY_MAX_ATTEMPTS: ${PAYMENT_RECOVERY_MAX_ATTEMPTS:-20}
      PAYMENT_CLAIM_SECONDS: ${PAYMENT_CLAIM_SECONDS:-}
      TICKET_RETRY_BACKOFF_SECONDS: ${TICKET_RETRY_BACKOFF_SECONDS:-30}
      TICKET_RETRY_MAX_SECONDS: ${TICKET_RETRY_MAX_SECONDS:-3600}
      TICKET_RETRY_BATCH: ${TICKET_RETRY_BATCH:-50}
      TICKET_RETRY_MAX_ATTEMPTS: ${TICKET_RETRY_MAX_ATTEMPTS:-50}
    depends_on:
      mysql: { condition: service_healthy }

  ticket-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/ticket/Dockerfile }
    environment:
      <<: [*db-env, *service-urls]
      PORT: 3005
      DB_NAME: ${TICKET_DB_NAME}
      DB_USER: ${TICKET_DB_USER}
      DB_PASSWORD: ${TICKET_DB_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${TICKET_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${TICKET_MINIO_SECRET_KEY}
      MINIO_BUCKET_QR: ${MINIO_BUCKET_QR}
    depends_on:
      mysql: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      <<: *service-urls
      NODE_ENV: ${NODE_ENV}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_FORWARD_SECRET: ${GATEWAY_FORWARD_SECRET}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-60}
      GATEWAY_HEADERS_TIMEOUT_SECONDS: ${GATEWAY_HEADERS_TIMEOUT_SECONDS:-15}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - '${GATEWAY_HOST_PORT}:8080'
    # Sin depends_on de salud: si un servicio cae, el gateway sigue y responde 503 solo en sus rutas.
    depends_on:
      [identity-service, catalog-service, inventory-service, purchase-service, ticket-service]

  # Servidor mock para las apps (solo desarrollo): docker compose --profile mock up mock
  mock:
    image: stoplight/prism:5
    profiles: [mock]
    # -m false: el modo multiproceso de Prism falla con el Node 24 de la imagen (isPrimary).
    command: ['mock', '-m', 'false', '-h', '0.0.0.0', '-p', '4010', '/spec/tickethub.openapi.json']
    volumes:
      - ./mock:/spec:ro
    ports:
      - '127.0.0.1:${MOCK_HOST_PORT:-4010}:4010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:4010/api/v1/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tickethub]

  # Pruebas de integración (node:test + fetch) dentro de la red privada: npm test
  tests:
    image: node:20-alpine
    profiles: [test]
    working_dir: /app
    volumes:
      - ./tests:/app/tests:ro
      - ./mock:/app/mock:ro
      - ./services/gateway/src:/app/services/gateway/src:ro
      - ./services/common/src:/app/services/common/src:ro
      - ./services/purchase/src/config.js:/app/services/purchase/src/config.js:ro
      - ./services/purchase/src/schema.js:/app/services/purchase/src/schema.js:ro
      - ./services/inventory/src/config.js:/app/services/inventory/src/config.js:ro
    command: ['node', '--test', '--test-concurrency=1', '--test-reporter=spec', 'tests/']
    environment:
      GATEWAY_URL: http://gateway:8080/api/v1
      IDENTITY_URL: http://identity-service:3001/api/v1
      CATALOG_URL: http://catalog-service:3002/api/v1
      FAKES_PORT: 4100
      MAILPIT_URL: http://mailpit:8025
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      gateway: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    networks: [tickethub]

networks:
  tickethub:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
